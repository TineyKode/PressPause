<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PressPause reminder</title>
    <link rel="stylesheet" href="reminder.css" />
  </head>
  <body>
    <main class="reminder-card">
      <p class="eyebrow">PressPause</p>
      <h1 id="title">Time to pause</h1>
      <p id="message">Stretch, eat, walk, or rest.</p>
      <div class="actions">
        <button id="snoozeFive" class="secondary" type="button">Snooze 5 min</button>
        <button id="snoozeTen" class="secondary" type="button">Snooze 10 min</button>
        <button id="dismiss" class="primary" type="button">Dismiss</button>
      </div>
    </main>
    <script src="reminder.js"></script>
  </body>
</html>
